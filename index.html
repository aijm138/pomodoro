<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a0a0a" />
    <meta
      name="description"
      content="A clean, focused Pomodoro timer for work and breaks. Works fully offline."
    />

    <!-- PWA / installability -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Pomodoro" />

    <!-- iOS Safari home-screen / standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pomodoro" />
    <link rel="apple-touch-icon" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- Icons / favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48x48.png" />

    <!-- Windows / Edge tiles -->
    <meta name="msapplication-TileColor" content="#1a0a0a" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />

    <title>Pomodoro Timer</title>
  </head>
  <body class="min-h-screen font-sans antialiased text-white">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
